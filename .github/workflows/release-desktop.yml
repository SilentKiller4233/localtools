# Desktop release pipeline — three-OS Tauri build matrix.
#
# STILL GATED (`if: false`): signing secrets + updater decision are Phase 15
# work (D-037); enabling before then would publish unsigned artifacts from
# a tag. The Phase 13 wiring below is complete and exercised piecewise by
# the CI desktop-build job (same cargo build/test pipeline on ubuntu) —
# flip `if: false` off in Phase 15 after the signing decision. See
# DECISIONS.md D-005 (placeholder rationale) and D-037 (updater/signing).

name: Release (desktop)

on:
  push:
    tags:
      - 'v*'

jobs:
  build-matrix:
    if: false # enable in Phase 15 with signing (D-037)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            args: ''
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: ''
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace (client embeds into tauri context)
        run: pnpm build

      - name: Build the engine bundle (server + prod deps + node runtime)
        run: |
          set -euo pipefail
          export LOCALTOOLS_DESKTOP_NODE="$(which node)"
          node apps/desktop/scripts/build-engine-dist.mjs

      - name: Build the desktop installer (tauri-action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Signing secrets arrive with the Phase 15 decision (D-037):
          # APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
          # APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID,
          # TAURI_SIGNING_PRIVATE_KEY / TAURI_SIGNING_PRIVATE_KEY_PASSWORD (updater)
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'LocalTools ${{ github.ref_name }}'
          releaseBody: 'See the assets to download the installer for your platform. Unsigned until Phase 15 (D-037) — see README bypass steps.'
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
