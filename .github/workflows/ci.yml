name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify (format + lint + typecheck + build + tests + 14.5 bundle-size + 14.8 licensing gates)
        run: pnpm verify

      # Section 5.5 supply-chain: fail on high/critical known vulns in the
      # committed lockfile (dev + prod both — a dev-dep vuln in a build
      # pipeline is still a real vuln).
      - name: pnpm audit (fail on high/critical)
        run: pnpm audit --audit-level high

  licensing:
    # Section 14.8: the required licensing notes must exist in
    # DECISIONS.md (Ghostscript AGPL/subprocess reasoning, ffmpeg variant,
    # @imgly/background-removal status, RAR constraint, mock-downloader
    # decision). Also the Section 14.8 CI job from the Definition of Done.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Required licensing notes present in DECISIONS.md
        run: node tools/licensing-check.mjs

  supply-chain:
    # Section 5.5 + 14.7: Trivy scan of the built engine image failing on
    # new HIGH/CRITICAL findings, plus cargo audit for the Rust shell.
    # (Scanning the image requires building it — ubuntu only, same as the
    # compose-stack job; the Windows dev host has no Docker, D-015.)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
          trivy --version

      - name: Build the engine image
        run: docker compose build engine

      - name: Trivy scan — engine image (fail on HIGH/CRITICAL)
        run: |
          set -euo pipefail
          # `docker compose config --images` lists every service's image —
          # pick the ENGINE's exactly (line 2 is the client's; grep has
          # already bitten us once by matching the wrong service).
          IMAGE="$(docker compose config --images engine 2>/dev/null || true)"
          if [ -z "$IMAGE" ]; then
            # Older compose versions don't filter by service — fall back
            # to the deterministic <project>-<service> naming.
            IMAGE="$(docker compose config --format json | node -e "let s='';process.stdin.on('data',c=>s+=c).on('end',()=>{const cfg=JSON.parse(s);const svc=cfg.services.engine;console.log(svc.image ?? '')}")"
          fi
          if [ -z "$IMAGE" ]; then
            IMAGE="$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -- '-engine' | head -n1)"
          fi
          echo "scanning: $IMAGE"
          test -n "$IMAGE"
          trivy image --severity HIGH,CRITICAL --exit-code 1 --ignore-unfixed "$IMAGE"

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      # Spec 5.5: "cargo audit in CI, fail on high/critical" — plain
      # `cargo audit` exits non-zero on real vulnerabilities and prints
      # unmaintained/unsound advisories as warnings. `--deny warnings`
      # proved wrong on the first live run (run 34635985930): 7 denied
      # warnings, ALL unmaintained/unsound advisories in Tauri's own
      # transitive tree (proc-macro-error, unic-*, glib 0.18.5) — crates
      # we cannot remove without patching Tauri. Recorded in D-043.
      - name: cargo audit — Rust shell lockfile (vulnerabilities fail the build)
        working-directory: apps/desktop/src-tauri
        run: cargo audit

  compose-stack:
    # Phase 4 acceptance: the Docker stack test (Section 14.7 engine round
    # trip). Runs only where Docker exists (ubuntu runners) — the Windows
    # dev host has no Docker (recorded in DECISIONS.md).
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Build the stack
        run: docker compose build

      # Phase 14 (Section 11): record the built engine image size in the
      # CI log — README's size note cites this step.
      # The MB conversion is done in bash, not in the Go template: Docker's
      # template function set has no `div`, so `{{div .Size 1048576}}` fails
      # with "function div not defined". This step never ran while CI was
      # billing-blocked, which is how the bug stayed hidden until the first
      # real run. `ENGINE_IMAGE_SIZE` (bytes) is the value README cites.
      - name: Engine image size (Section 11 record)
        run: |
          IMAGE="$(docker compose config --images engine 2>/dev/null || true)"
          if [ -z "$IMAGE" ]; then
            IMAGE="$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -- '-engine' | head -n1)"
          fi
          echo "engine image: $IMAGE"
          BYTES="$(docker image inspect "$IMAGE" --format '{{.Size}}')"
          # Guard: bash arithmetic treats an empty value as 0, so without this
          # a missing/unreadable image would record a bogus "0MB" and pass.
          if [ -z "$BYTES" ]; then
            echo "::error::could not read the size of engine image '$IMAGE'"
            exit 1
          fi
          echo "ENGINE_IMAGE_SIZE=${BYTES} bytes ($((BYTES / 1048576))MB)"

      - name: Bring the stack up
        run: docker compose up -d --wait

      # Always leave the engine's own logs in the CI record — the job's
      # biggest debugging gap so far has been tearing down without logs.
      - name: Engine container logs (diagnostics)
        if: always()
        run: docker compose logs engine || true

      - name: Engine round trip (PDF Group B through the container)
        run: |
          set -euo pipefail
          # Health gate.
          curl -fsS http://127.0.0.1:8787/healthz
          # Section 14.7-style round trip: one real Group B tool through
          # the containerized engine — deep-compress the committed fixture.
          REPLY=$(curl -fsS -X POST http://127.0.0.1:8787/pdf/deep-compress \
            -F 'options={"preset":"ebook","file":0}' \
            -F 'files=@fixtures/pdf/simple-text.pdf;filename=doc.pdf')
          echo "$REPLY" | node -e "
            let s=''; process.stdin.on('data',c=>s+=c).on('end',()=>{
              const r = JSON.parse(s);
              if (!r.ok) { console.error('engine returned error', r.error); process.exit(1); }
              const f = r.data.files[0];
              if (!f || f.ext !== 'pdf' || f.data.length < 100) {
                console.error('bad output file'); process.exit(1);
              }
              console.log('ENGINE_STACK_PASS', f.data.length, 'b64 chars');
            });
          "

      - name: Media round trip (ffmpeg Group B through the container)
        run: |
          set -euo pipefail
          # Phase 7: one real media Group B tool through the containerized
          # apt-ffmpeg engine — convert the committed mp3 fixture to wav.
          REPLY=$(curl -fsS -X POST http://127.0.0.1:8787/media/audio-convert \
            -F 'options={"file":0,"format":"wav"}' \
            -F 'files=@fixtures/media/sample-short.mp3;filename=tone.mp3')
          echo "$REPLY" | node -e "
            let s=''; process.stdin.on('data',c=>s+=c).on('end',()=>{
              const r = JSON.parse(s);
              if (!r.ok) { console.error('media engine returned error', r.error); process.exit(1); }
              const f = r.data.files[0];
              if (!f || f.ext !== 'wav' || f.data.length < 100) {
                console.error('bad media output'); process.exit(1);
              }
              console.log('MEDIA_STACK_PASS', f.data.length, 'b64 chars');
            });
          "

      - name: Downloader SSRF round trip (Group C through the container)
        run: |
          set -euo pipefail
          # Phase 8: the downloader's SSRF guard through the containerized
          # engine. A private-IP URL must be rejected with the blocked-host
          # taxonomy BEFORE any outbound request — no live-site fetch ever
          # happens in CI (D-026), this proves the guard runs in Docker.
          REPLY=$(curl -sS -X POST http://127.0.0.1:8787/downloader/metadata \
            -H 'content-type: application/json' \
            -d '{"url":"http://192.168.1.1/video"}')
          echo "$REPLY" | node -e "
            let s=''; process.stdin.on('data',c=>s+=c).on('end',()=>{
              const r = JSON.parse(s);
              if (r.ok || r.error.code !== 'blocked-host') {
                console.error('downloader SSRF check failed', JSON.stringify(r));
                process.exit(1);
              }
              console.log('DOWNLOADER_SSRF_PASS');
            });
          "

      - name: Speech round trip (Piper TTS through the container)
        run: |
          set -euo pipefail
          # Phase 9: one real speech Group B tool through the containerized
          # engine — /opt/piper/piper synthesizes text to a WAV. The voice
          # model lazy-downloads from HF inside the container on first use
          # (D-030; ~63MB, Cache-style tmpfs — acceptable for the one CI
          # round trip) and is digest-verified.
          REPLY=$(curl -fsS -X POST http://127.0.0.1:8787/media/text-to-speech \
            -F 'options={"text":"Phase nine speech round trip.","voice":"en_US-lessac-medium","speed":1}')
          echo "$REPLY" | node -e "
            let s=''; process.stdin.on('data',c=>s+=c).on('end',()=>{
              const r = JSON.parse(s);
              if (!r.ok) { console.error('speech engine returned error', r.error); process.exit(1); }
              const f = r.data.files[0];
              if (!f || f.ext !== 'wav' || f.data.length < 100) {
                console.error('bad speech output'); process.exit(1);
              }
              console.log('SPEECH_STACK_PASS', f.data.length, 'b64 chars');
            });
          "

      - name: Client serves
        run: |
          set -euo pipefail
          curl -fsS -o /dev/null http://localhost:5173/

      - name: Tear down
        if: always()
        run: docker compose down -v

  accessibility:
    # Phase 12 acceptance (Section 14.6): axe-core scan on every route in
    # both themes (zero critical/serious), 390px responsive check, keyboard
    # sweep — against the PRODUCTION build served by vite preview. Chrome
    # comes from the Playwright registry (npx playwright install chromium).
    # Phase 13 adds the worker-offload + offline checks here; 40m because
    # the sweep alone takes ~15m and the additions once wedged past 30m.
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Chromium (Playwright registry)
        run: pnpm --filter @localtools/client exec playwright install chromium --with-deps

      - name: Build the workspace (production; turbo orders deps)
        run: pnpm build

      - name: Serve the production build
        run: |
          cd apps/client
          npx vite preview --port 4173 --strictPort &
          for i in $(seq 1 30); do
            curl -fsS -o /dev/null http://localhost:4173/ && break
            sleep 1
          done
          curl -fsS -o /dev/null http://localhost:4173/

      - name: Section 14.6 — axe scan on every route (both themes)
        run: cd apps/client && node scripts/a11y-scan.mjs

      - name: Section 8 — 390px responsive check
        run: cd apps/client && node scripts/responsive-check.mjs

      - name: Section 14.6 — keyboard sweep (all routes + 4 tool runs)
        run: cd apps/client && node scripts/keyboard-sweep.mjs

      - name: Section 13 — WebKit WASM smoke (qpdf-wasm, no COOP/COEP)
        run: |
          pnpm --filter @localtools/client exec playwright install webkit --with-deps
          cd apps/client && node scripts/webkit-wasm-smoke.mjs

      - name: Section 14.5 — worker-offload check (50MB PDF, zero main-thread blocking)
        timeout-minutes: 6
        run: cd apps/client && node scripts/worker-offload-test.mjs

      - name: Section 8 — PWA offline reload (service-worker cache)
        timeout-minutes: 6
        run: cd apps/client && node scripts/offline-test.mjs

  desktop-build:
    # Phase 10 acceptance (Section 14.7): build the Tauri shell on Linux,
    # then prove the engine sidecar boots and answers /healthz — no GUI
    # click-through in CI (that's the owner's manual checklist, TESTS.md).
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6
        with:
          version: 10.34.5

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install Linux desktop build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libgtk-3-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            librsvg2-dev libssl-dev

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build workspace (client needs @localtools/ui etc. built first)
        # tauri::generate_context! embeds ../client/dist at Rust compile
        # time — cargo build fails without it. The client's Vite build
        # resolves workspace packages (@localtools/ui), so run the full
        # workspace build (turbo orders dependencies) instead of the
        # client package alone.
        run: pnpm build

      - name: Build the engine bundle (server + prod deps + node runtime)
        run: |
          set -euo pipefail
          export LOCALTOOLS_DESKTOP_NODE="$(which node)"
          node apps/desktop/scripts/build-engine-dist.mjs

      - name: Build the Tauri shell (debug — proves the full compile+bundle)
        run: cargo build --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Shell smoke tests (mock-server download pipeline + manifest pins)
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml

      - name: Sidecar boot + healthz smoke (the real engine, headless)
        run: |
          set -euo pipefail
          cd apps/desktop/src-tauri
          # Standalone binary under setsid — the engine must never share
          # the runner's managed step tree (cargo-test-harness spawns
          # wedged the runner's cleanup: three deterministic job kills,
          # see D-033 gotchas). Hard-bounded so a wedge can't hang CI.
          timeout 150s setsid cargo run --bin ci_smoke -- "$GITHUB_WORKSPACE" 8799
          echo SIDECAR_HEALTHZ_PASS

      - name: Build the release shell (the AppImage payload binary)
        run: |
          set -euo pipefail
          cargo build --release --manifest-path apps/desktop/src-tauri/Cargo.toml
          ls -la apps/desktop/src-tauri/target/release/localtools-desktop
          echo TAURI_RELEASE_BUILD_PASS
